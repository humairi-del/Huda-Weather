<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طقس هدى وما جاورها</title>
<meta name="theme-color" content="#07111f">
<style>
*{box-sizing:border-box}body{margin:0;background:#07131b;color:#f4fbff;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}.loader{padding:24px;line-height:2;color:#9cc3ce}.loader strong{display:block;color:#fff;font-size:22px;margin-bottom:8px}.error{color:#ffb4b4}
</style>
</head>
<body>
<div class="loader" id="loader"><strong>طقس هدى وما جاورها</strong>جاري تشغيل الموقع...</div>
<script>
(async()=>{
  try{
    const r=await fetch('./base-2.1.1.html?v=2.2.3',{cache:'no-store'});
    if(!r.ok) throw new Error('base');
    let html=await r.text();
    const bridge=`<script src="./patch-2.2.js?v=2.2.3"><\/script><script>(()=>{try{if(typeof starsData!=="undefined")window.starsData=starsData;if(typeof parseStarEntryDate==="function")window.parseStarEntryDate=parseStarEntryDate;const originalObserver=window.showObserverWeather;if(typeof originalObserver==="function")window.showObserverWeather=function(d){window.weatherData=d;return originalObserver(d)};const patchedModels=window.loadModels;if(typeof patchedModels==="function")window.loadModels=async function(){await patchedModels();if(typeof modelsLoaded!=="undefined")modelsLoaded=true};const patchedQuakes=window.loadQuakes;if(typeof patchedQuakes==="function")window.loadQuakes=async function(){await patchedQuakes();if(typeof quakesLoaded!=="undefined")quakesLoaded=true};const dustFrame=document.querySelector("#dustModal iframe");if(dustFrame)dustFrame.src=dustFrame.src.replace("overlay=dust","overlay=dustsm").replace("product=ecmwf","product=cams-global");if(typeof weatherData!=="undefined")window.weatherData=weatherData;if(typeof showHeaderStar==="function")showHeaderStar();if(typeof weatherData!=="undefined"&&weatherData){showObserverWeather(weatherData);showWeeklyWeather(weatherData);showWeatherAlerts(weatherData)}}catch(e){console.error(e)}})();<\/script><script src="./stars-fix.js?v=2.2.3"><\/script><script src="./dust-view-fix.js?v=2.2.3"><\/script><script src="./sections-fix.js?v=2.2.3"><\/script><script src="./prayer-7day.js?v=2.2.3"><\/script><script src="./moist-waves-72h.js?v=20261010-2"><\/script>`;
    if(!html.includes('patch-2.2.js')) html=html.replace('</body>',bridge+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loader').innerHTML='<strong class="error">تعذر تشغيل الموقع</strong>تحقق من الاتصال ثم أعد تحميل الصفحة.';
  }
})();
</script>
</body>
</html>
