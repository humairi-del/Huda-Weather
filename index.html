<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طقس هدى وما جاورها</title>
<meta name="theme-color" content="#07111f">
<style>
*{box-sizing:border-box}body{margin:0;background:#07131b;color:#f4fbff;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}.loader{padding:24px;line-height:2;color:#9cc3ce}.loader strong{display:block;color:#fff;font-size:22px;margin-bottom:8px}.error{color:#ffb4b4}
</style>
</head>
<body>
<div class="loader" id="loader"><strong>طقس هدى وما جاورها</strong>جاري تشغيل الموقع...</div>
<script>
(async()=>{
  try{
    const r=await fetch('./base-2.1.1.html?v=2.2.0',{cache:'no-store'});
    if(!r.ok) throw new Error('base');
    let html=await r.text();
    const patch='<script src="./patch-2.2.js?v=2.2.0"><\/script>';
    if(!html.includes('patch-2.2.js')) html=html.replace('</body>',patch+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loader').innerHTML='<strong class="error">تعذر تشغيل الموقع</strong>تحقق من الاتصال ثم أعد تحميل الصفحة.';
  }
})();
</script>
</body>
</html>
