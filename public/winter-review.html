<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة متابعة الرياح والبرد — طقس هدى</title><link rel="stylesheet" href="./luxe-2026.css"><link rel="stylesheet" href="./winter-review.css"><script src="./sandstorm.js" defer></script><script src="./winter-weather.js" defer></script><script src="./weather-core.js" defer></script><script src="./star-calendar.js" defer></script><script src="./winter-fixtures.js" defer></script><script src="./smart-alerts.js" defer></script><script src="./daily-card.js" defer></script><script src="./luxe-ui.js" defer></script><script src="./winter-review.js" defer></script></head><body><main><h1>مراجعة الرياح والبرد والبطاقة</h1><p class="qa-notice">بيانات اختبار مصطنعة — ليست توقعًا حاليًا لهدى. هذه الصفحة للمعاينة فقط، بلا إشعارات أو تسجيل زيارات.</p><label for="scenario">حالة الاختبار</label><select id="scenario"><option value="both">اجتماع الرياح والبرد</option><option value="north">رياح شمالية وحدها</option><option value="cold">برد دون رياح شمالية</option><option value="quiet">غياب التنبيه</option><option value="missing">نقص بيانات الرطوبة</option><option value="ended">انتهاء الحالة</option><option value="stale">بيانات قديمة بعد حالة نشطة</option></select><section id="weatherAlerts"><div id="smartWeatherAlerts" aria-live="polite"></div></section><section><h2>تقويم طقس هدى</h2><p>صورة ١٠٨٠ × ١٩٢٠ — اضغط على البطاقة لتكبيرها.</p><canvas id="dailyWeatherCanvas" width="1080" height="1920"></canvas><p id="dailyCardAccessible" class="sr-only"></p><div class="actions"><button id="saveDailyCard">حفظ البطاقة</button><button id="zoomDailyCard">تكبير البطاقة</button></div><p id="dailyCardStatus" role="status"></p></section><details><summary>نتيجة فحص التنسيق</summary><output id="layoutResult"></output></details><p><a href="/">العودة إلى معاينة الموقع</a></p></main></body></html>
