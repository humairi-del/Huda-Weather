<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد هدى الذكي — الإدارة الخاصة</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:20px;background:#f5f7fa;color:#17202a}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccd}button{font-weight:700;cursor:pointer}textarea{min-height:110px}.muted{color:#667;font-size:.9rem}.ok{color:#176b36}.bad{color:#9b1c1c}</style></head><body><h1>راصد هدى الذكي</h1><p class="muted">لوحة خاصة للتعليم والمراجعة — غير مخصصة للزوار.</p><div class="card"><h2>تسجيل الدخول</h2><input id="email" placeholder="البريد"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><div id="loginMsg"></div></div><div class="card"><h2>إضافة معلومة</h2><input id="subject" placeholder="الموضوع، مثال: جبل شبح"><textarea id="statement" placeholder="المعلومة الدقيقة"></textarea><button onclick="submitInfo()">إرسال</button><div id="submitMsg"></div></div><div class="card"><h2>بانتظار المراجعة</h2><button onclick="loadPending()">تحديث القائمة</button><div id="pending"></div></div><script>let token="";async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(path,opt);let d=await r.json();if(!r.ok)throw new Error(d.detail||"حدث خطأ");return d}async function login(){try{let d=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});token=d.access_token;loginMsg.innerHTML='<span class="ok">تم تسجيل الدخول</span>';loadPending()}catch(e){loginMsg.innerHTML='<span class="bad">'+e.message+'</span>'}}async function submitInfo(){try{let d=await api("/knowledge",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:subject.value,statement:statement.value})});submitMsg.textContent="تم الحفظ: "+d.status}catch(e){submitMsg.textContent=e.message}}async function loadPending(){try{let a=await api("/knowledge/pending");pending.innerHTML=a.length?a.map(x=>'<div class="card"><b>'+esc(x.subject)+'</b><p>'+esc(x.statement)+'</p><button onclick="review(\''+x.id+'\',\'approved\')">اعتماد</button><button onclick="review(\''+x.id+'\',\'rejected\')">رفض</button></div>').join(""):"لا توجد معلومات بانتظار المراجعة"}catch(e){pending.textContent=e.message}}async function review(id,decision){try{await api("/knowledge/"+id+"/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision})});loadPending()}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}</script></body></html>
