<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد هدى — المالك</title><style>body{font-family:system-ui;background:#07111f;color:#eef5ff;margin:0}main{max-width:900px;margin:auto;padding:24px}.card{background:#0d1b2e;border:1px solid #28415f;border-radius:16px;padding:18px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #365578;background:#10233b;color:white;margin:6px 0;width:100%;box-sizing:border-box}button{background:#214c7d}.hide{display:none}.bad{color:#ffaaaa}.ok{color:#7ee2aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}</style></head><body><main><h1>🌦️ راصد هدى الذكي</h1><p>لوحة المالك — هدى، حبان، شبوة</p><div id="login" class="card"><h2>دخول المالك</h2><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني"><input id="pass" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="go" type="button">دخول</button><p id="msg"></p></div><div id="panel" class="hide"><button id="out" type="button">تسجيل الخروج</button><div class="grid"><div class="card"><h3>الحالة</h3><div id="health">...</div></div><div class="card"><h3>الذكاء الاصطناعي</h3><div id="ai">...</div></div><div class="card"><h3>التحليل</h3><div id="analysis">...</div></div></div><div class="card"><h3>الموديلات</h3><div id="models">...</div></div><div class="grid"><div class="card"><h3>العاصفة الرملية</h3><div id="dust">...</div></div><div class="card"><h3>بحر العرب</h3><div id="sea">...</div></div></div></div></main><script src="/owner-app.js?v=3"></script></body></html>
