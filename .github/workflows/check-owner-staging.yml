name: Check HADA Owner Staging
on:
  push:
    branches:
      - owner-portal-development
    paths:
      - 'owner-portal/**'
      - '.github/workflows/check-owner-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend syntax and tests
        run: |
          npm run check
          npm test
          node --check ../owner-api-client.js
          node --check ../owner-settings.js
          node --check ../owner-audit.js
          node --check ../owner-overview.js
          node --check ../owner-review.js
      - name: Verify isolated deploy assets
        run: |
          test -s ../index.html
          test -s ../owner-api-client.js
          test -s ../owner-settings.js
          test -s ../owner-audit.js
          test -s ../owner-overview.js
          test -s ../owner-review.js
          grep -Fq 'directory = "./public"' wrangler.dev.toml
          grep -Fq 'hada-owner-portal-staging' wrangler.dev.toml
