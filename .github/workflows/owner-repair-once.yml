name: Repair owner credential material

on:
  push:
    branches:
      - rasid-hada-private
    paths:
      - '.github/workflows/owner-repair-once.yml'

permissions:
  contents: read

jobs:
  repair-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate new pepper and matching owner hash
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const pepper = crypto.randomBytes(32).toString('hex');
          const salt = crypto.randomBytes(16).toString('hex');
          const hash = crypto.createHmac('sha256', pepper).update(salt + '\0' + process.env.OWNER_PASSWORD).digest('hex');
          fs.writeFileSync('/tmp/auth_pepper', pepper, {mode:0o600});
          fs.writeFileSync('/tmp/owner_hash', 'hmac_sha256$' + salt + '$' + hash + '\n', {mode:0o600});
          NODE
      - name: Update Worker AUTH_PEPPER
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a16d4f178bae474099aa23095030294
        run: |
          printf '%s' "$(cat /tmp/auth_pepper)" | npx wrangler secret put AUTH_PEPPER --name rasid-hada
      - name: Package verifier
        run: |
          mkdir -p repair-output
          mv /tmp/owner_hash repair-output/owner_hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-repair-verifier
          path: repair-output/owner_hash.txt
          retention-days: 1
