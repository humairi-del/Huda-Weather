name: Apply Huda Weather 2.1.1
on:
  push:
    paths:
      - '.github/workflows/apply-huda-weather-2.1.1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused 2.1.1 usability update
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # Simple, visitor-friendly service names.
          s=s.replace('🌧️ خريطة الطقس','🗺️ خريطة الطقس')
          s=s.replace('🌀 بحر العرب والحالات المدارية','🌊 بحر العرب')
          s=s.replace('🛰️ مقارنة الموديلات','🌦️ توقعات الموديلات')
          s=s.replace('🌍 متابعة الزلازل','🌍 الزلازل')

          # Observer wording: do not present forecast/model values as confirmed observations.
          s=s.replace('📡 الراصد — هدى وحبان','🌤️ الأجواء حاليًا')
          s=s.replace('<span>🌧️ المطر الآن</span>','<span>🌧️ المطر</span>')
          s=s.replace('<span>🌫️ الغبار PM10</span>','<span>🌫️ مؤشر PM10</span>')
          s=s.replace('🌧️ هطول ملحوظ حاليًا حسب بيانات النموذج.','🕒 هطول متوقع في الساعة الحالية حسب بيانات التوقع، وليس رصدًا ميدانيًا.')
          s=s.replace('☁️ فرصة المطر مرتفعة نسبيًا خلال الفترة الحالية.','🕒 فرصة مطر متوقعة مرتفعة نسبيًا خلال الفترة الحالية.')
          s=s.replace('☁️ غطاء سحابي كثيف نسبيًا فوق المنطقة.','🕒 غطاء سحابي كثيف متوقع نسبيًا فوق المنطقة.')
          s=s.replace('📡 لا تظهر حاليًا إشارة قوية لهطول مباشر على هدى.','🕒 لا تظهر في التوقع الحالي إشارة قوية لهطول على هدى.')

          # Replace old What's new entry with About site.
          s=s.replace('<button class="whats-new-btn" onclick="openWhatsNew()">✨ ما الجديد</button>', '<button class="whats-new-btn" onclick="openWhatsNew()">ℹ️ عن الموقع</button>')
          old_about='''<!-- ما الجديد -->\n<div class="modal" id="whatsNewModal">\n  <div class="modal-content">\n    <div class="modal-header">\n      <h2>✨ ما الجديد في تحديث 2</h2>\n      <button class="close" onclick="closeWhatsNew()">×</button>\n    </div>\n    <div class="modal-pad">\n      <div class="update-grid">\n        <div class="update-item"><span>📡 الراصد</span><strong>مطر • سحب • غبار • رؤية • برد • رياح</strong></div>\n        <div class="update-item"><span>🛰️ الموديلات</span><strong>ECMWF • GFS • ICON • GEM/CMC • AIFS</strong></div>\n        <div class="update-item"><span>🌍 الزلازل</span><strong>متابعة أحدث الرصد القريب من المنطقة</strong></div>\n        <div class="update-item"><span>⭐ النجوم</span><strong>28 نجمًا مع التاريخ والتفاصيل قريبًا</strong></div>\n        <div class="update-item"><span>🕌 الصلاة</span><strong>جدول حبان المعتمد • بدون وقت الجمعة</strong></div>\n        <div class="update-item"><span>📱 التطبيق</span><strong>قابل للتثبيت على شاشة الجوال</strong></div>\n      </div>\n    </div>\n  </div>\n</div>'''
          new_about='''<!-- عن الموقع -->\n<div class="modal" id="whatsNewModal">\n  <div class="modal-content">\n    <div class="modal-header">\n      <h2>ℹ️ عن الموقع</h2>\n      <button class="close" onclick="closeWhatsNew()">×</button>\n    </div>\n    <div class="modal-pad">\n      <div class="status-box">\n        <strong>طقس هدى وما جاورها</strong><br>\n        موقع محلي مبسط لخدمة هدى وحبان وما جاورهما في محافظة شبوة، ويجمع حالة الطقس والتوقعات وخرائط الطقس وبحر العرب وحساب النجوم ومواقيت الصلاة في مكان واحد.\n      </div>\n      <div class="small-note" style="font-size:13px;margin-top:12px">بيانات الطقس والتوقعات تعتمد على خدمات ونماذج جوية رقمية، وتُعرض بصورة مبسطة للمتابعة. القيم المتوقعة ليست رصدًا ميدانيًا مؤكدًا.</div>\n      <div class="source-note" style="margin-top:14px">الإصدار 2.1.1</div>\n    </div>\n  </div>\n</div>'''
          assert old_about in s, 'old about block not found'
          s=s.replace(old_about,new_about)

          # Clear install guidance directly under the button; no technical PWA language.
          install_button='''  <button class="action-btn install-btn" id="installButton" onclick="installApp()">\n    📱 تثبيت الموقع كتطبيق\n  </button>'''
          install_new=install_button+'''\n  <div class="small-note" style="text-align:center;margin-top:-3px">📲 اضغط للتثبيت. إذا لم تظهر نافذة التثبيت، اختر من قائمة المتصفح «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق».</div>'''
          assert install_button in s, 'install button not found'
          s=s.replace(install_button,install_new,1)

          # Add a real in-page forecast alerts section. It never claims push notifications are active.
          marker='''<!-- الساعات -->'''
          alerts='''<!-- تنبيهات الطقس داخل الموقع -->\n<section class="card" id="weatherAlertsCard">\n  <div class="card-title">🔔 تنبيهات الطقس</div>\n  <div class="status-box" id="weatherAlerts">جاري فحص التوقعات القادمة...</div>\n  <div class="small-note">🔴 «يحدث الآن» لا يُستخدم هنا إلا مع رصد فعلي مؤكد. تنبيهات هذا القسم مبنية على التوقعات وتظهر بصيغة 🕒 «متوقع». إشعارات الهاتف الخارجية غير مفعلة حاليًا.</div>\n</section>\n\n'''
          assert marker in s, 'hourly marker not found'
          s=s.replace(marker,alerts+marker,1)

          # Call alert renderer after weather data is available.
          s=s.replace('''    showObserverWeather(data);''','''    showObserverWeather(data);\n    showWeatherAlerts(data);''',1)

          # Forecast-only alert logic: rain, strong/northerly wind, cold, dust proxy/visibility, thunderstorms, heat.
          insert_before='''/* =========================================================\n   شبكة بحر العرب الموسعة'''
          alert_js=r'''/* =========================================================
   تنبيهات الطقس داخل الموقع - توقعات فقط
   ========================================================= */
function showWeatherAlerts(data){
  const box=document.getElementById("weatherAlerts");
  if(!box || !data?.hourly) return;
  const start=getCurrentHourIndex(data);
  const end=Math.min(start+24,data.hourly.time.length);
  const alerts=[];
  let maxRain=0,maxGust=0,minTemp=Infinity,maxTemp=-Infinity,minVis=Infinity,thunder=false,northWind=false;
  for(let i=start;i<end;i++){
    const rain=Number(data.hourly.precipitation_probability?.[i]??0);
    const gust=Number(data.hourly.wind_gusts_10m?.[i]??0);
    const temp=Number(data.hourly.temperature_2m?.[i]);
    const vis=Number(data.hourly.visibility?.[i]);
    const code=Number(data.hourly.weather_code?.[i]??0);
    const dir=Number(data.hourly.wind_direction_10m?.[i]);
    maxRain=Math.max(maxRain,rain); maxGust=Math.max(maxGust,gust);
    if(Number.isFinite(temp)){minTemp=Math.min(minTemp,temp);maxTemp=Math.max(maxTemp,temp)}
    if(Number.isFinite(vis) && vis>0) minVis=Math.min(minVis,vis);
    if(code>=95) thunder=true;
    if(gust>=35 && Number.isFinite(dir) && (dir>=315 || dir<=45)) northWind=true;
  }
  if(maxRain>=40) alerts.push(`🕒 🌧️ مطر متوقع: أعلى احتمال خلال 24 ساعة ${Math.round(maxRain)}%`);
  if(maxGust>=40) alerts.push(`🕒 💨 رياح قوية متوقعة: هبات قد تصل إلى ${Math.round(maxGust)} كم/س${northWind?' • بينها رياح شمالية':''}`);
  if(Number.isFinite(minTemp) && minTemp<=15) alerts.push(`🕒 🥶 برودة متوقعة: قد تنخفض الحرارة إلى ${Math.round(minTemp)}°`);
  if(thunder) alerts.push('🕒 ⛈️ عواصف رعدية أو برق متوقع خلال الساعات القادمة');
  if(Number.isFinite(maxTemp) && maxTemp>=40) alerts.push(`🕒 🌡️ حرارة شديدة متوقعة: قد تصل إلى ${Math.round(maxTemp)}°`);
  if(Number.isFinite(minVis) && minVis<=5000) alerts.push(`🕒 🌫️ تدنٍ في مدى الرؤية متوقع: قد يصل إلى ${(minVis/1000).toFixed(1)} كم`);
  box.innerHTML=alerts.length?alerts.map(x=>`<div style="margin:7px 0">${x}</div>`).join(''):'✅ لا تظهر خلال الساعات الـ24 القادمة تنبيهات جوية بارزة وفق التوقع الحالي.';
}

'''
          assert insert_before in s, 'sea section marker not found'
          s=s.replace(insert_before,alert_js+insert_before,1)

          # Footer version, while preserving automatic-update note.
          s=s.replace('بيانات الطقس والراصد تتحدث تلقائيًا','بيانات الطقس تتحدث تلقائيًا • الإصدار 2.1.1')

          # Safety checks: preserve major services and data.
          for token in ['const PRAYER_TABLE=','const starsData=','seaPoints=[','embed.windy.com','MODEL_LIST','loadQuakes','loadSeaWaves','manifest.webmanifest','sw.js']:
            assert token in s, token
          assert 'خامس","21 سبتمبر 2026' in s
          assert 'ℹ️ عن الموقع' in s and 'الإصدار 2.1.1' in s
          assert '🔔 تنبيهات الطقس' in s and 'إشعارات الهاتف الخارجية غير مفعلة حاليًا' in s
          assert s.count('<script')==s.count('</script>')
          assert s.count('<style')==s.count('</style>')
          assert s!=original
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('<script')==s.count('</script>')
          assert s.count('<style')==s.count('</style>')
          assert 'طقس هدى وما جاورها' in s
          assert 'ℹ️ عن الموقع' in s
          assert '🌦️ توقعات الموديلات' in s
          assert '🌍 الزلازل' in s
          assert '🔔 تنبيهات الطقس' in s
          assert 'إشعارات الهاتف الخارجية غير مفعلة حاليًا' in s
          assert 'const PRAYER_TABLE=' in s and 'const starsData=' in s and 'seaPoints=[' in s
          print('2.1.1 validation passed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: simplify Huda Weather 2.1.1 interface'
          git push
