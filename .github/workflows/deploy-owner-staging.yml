name: Deploy HADA Owner Staging
on:
  push:
    branches:
      - owner-portal-development
    paths:
      - 'owner-portal/**'
      - '.github/workflows/deploy-owner-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hada-owner-staging
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy owner portal staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/owner-portal-development'
    environment: owner-staging
    defaults:
      run:
        working-directory: owner-portal/backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-portal-development
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate backend
        run: |
          npm run check
          npm test
          node --check ../owner-api-client.js
          node --check ../owner-settings.js
          node --check ../owner-audit.js
      - name: Package owner UI into public-only directory
        run: |
          mkdir -p public
          cp ../index.html public/index.html
          cp ../owner-api-client.js public/owner-api-client.js
          cp ../owner-settings.js public/owner-settings.js
          cp ../owner-audit.js public/owner-audit.js
          test -s public/index.html
          test -s public/owner-api-client.js
          test -s public/owner-settings.js
          test -s public/owner-audit.js
      - name: Prevent API-only deployment replacing the owner UI
        run: |
          if ! grep -q 'assets' wrangler.dev.toml; then
            echo 'BLOCKED: frontend assets are not yet configured; preserving current staging UI.'
            exit 1
          fi
      - name: Verify staging target and owner-only assets
        run: |
          grep -Fq 'name = "hada-owner-portal-staging"' wrangler.dev.toml
          grep -Fq 'workers_dev = false' wrangler.dev.toml
          grep -Fq 'owner-dev.hada-weather.com' wrangler.dev.toml
          grep -Fq 'run_worker_first = ["/api/*"]' wrangler.dev.toml
          test ! -f public/src/index.js
      - name: Deploy isolated Worker
        run: npx wrangler deploy --config wrangler.dev.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
