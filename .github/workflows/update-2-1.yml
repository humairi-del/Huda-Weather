name: Apply Huda Weather 2.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-2-1.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted 2.1 changes and validate
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # CSS: remove What's New-only styles and make seasons compact cards.
          s=s.replace('.whats-new-wrap{text-align:center;margin:8px 0 14px}\n.whats-new-btn{border:1px solid #2b6472;background:#0d2a35;color:#dff8fb;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:bold;cursor:pointer}\n','')
          s=s.replace('/* ما الجديد + النجم الحالي */','/* النجم الحالي */')
          s=s.replace('.season{margin-bottom:15px}\n.season-title{font-size:16px;font-weight:bold;margin-bottom:8px;color:#f0cf76}\n.stars-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}\n.star-item{border:1px solid #294760;background:#0b192a;color:#fff;border-radius:12px;padding:11px;font-family:inherit;cursor:pointer;text-align:right}\n.star-name{display:block;font-weight:bold;font-size:15px;margin-bottom:5px}\n.star-date{display:block;color:#9fc3df;font-size:12px;line-height:1.6}\n', '.season{margin-bottom:10px;background:#091d26;border:1px solid #294760;border-radius:14px;padding:11px}\n.season-title{font-size:16px;font-weight:bold;margin-bottom:8px;color:#f0cf76}\n.stars-grid{display:grid;grid-template-columns:1fr;gap:3px}\n.star-item{border:0;border-bottom:1px solid #173746;background:transparent;color:#fff;padding:8px 3px;font-family:inherit;cursor:pointer;text-align:right;display:flex;align-items:center;justify-content:space-between;gap:8px}\n.star-item:last-child{border-bottom:0}\n.star-name{display:inline;font-weight:bold;font-size:14px;margin:0}\n.star-date{display:inline;color:#9fc3df;font-size:12px;white-space:nowrap}\n')
          s=s.replace('@media(max-width:420px){.stars-grid{grid-template-columns:1fr}}','@media(max-width:420px){.season{padding:9px}.star-item{padding:7px 2px}.star-name{font-size:13px}.star-date{font-size:11px}}')
          # Add compact atmosphere styling.
          marker='/* أفضل فرصة مطر */'
          atmosphere_css='.atmosphere-now{line-height:1.9;color:#d8e9ef}.atmosphere-now strong{color:#f4fbff}.dust-note{margin-top:9px;color:#b9d2e5;font-size:12px;line-height:1.7}\n\n'
          s=s.replace(marker, atmosphere_css+marker, 1)

          # Add current-atmosphere card after the existing current weather card.
          current_end='</section>\n\n<!-- الراصد المحلي -->'
          atmosphere_html='''</section>\n\n<!-- الأجواء حاليًا -->\n<section class="card">\n  <div class="card-title">🌤️ الأجواء حاليًا</div>\n  <div class="atmosphere-now" id="currentAtmosphere">جاري تحليل الأجواء الحالية...</div>\n</section>\n\n<!-- الراصد المحلي -->'''
          if current_end not in s: raise SystemExit('current weather insertion point not found')
          s=s.replace(current_end, atmosphere_html, 1)

          # PM10 label and cautious dust note.
          s=s.replace('<div class="observer-item"><span>🌫️ الغبار PM10</span><strong id="observerDust">--</strong></div>', '<div class="observer-item"><span>🌫️ الجسيمات PM10</span><strong id="observerDust">--</strong></div>')
          s=s.replace('  <div class="observer-summary" id="observerSummary">جاري تحديث الراصد...</div>', '  <div class="dust-note" id="observerDustNote">جاري تقييم الجسيمات والرؤية...</div>\n  <div class="observer-summary" id="observerSummary">جاري تحديث الراصد...</div>')

          # Remove What's New button and modal.
          s=re.sub(r'\n<div class="whats-new-wrap">\s*<button class="whats-new-btn" onclick="openWhatsNew\(\)">✨ ما الجديد</button>\s*</div>\n', '\n', s, count=1)
          s=re.sub(r'\n<!-- ما الجديد -->\s*<div class="modal" id="whatsNewModal">.*?</div>\s*</div>\s*</div>\s*(?=\n<!-- حساب النجوم -->)', '\n', s, count=1, flags=re.S)
          s=s.replace('function openWhatsNew(){\n  document.getElementById("whatsNewModal").style.display="block";\n  document.body.style.overflow="hidden";\n}\nfunction closeWhatsNew(){\n  document.getElementById("whatsNewModal").style.display="none";\n  document.body.style.overflow="";\n}\n','')
          s=s.replace('    const whatsNew=document.getElementById("whatsNewModal");\n','')
          s=s.replace('    if(event.target===whatsNew) closeWhatsNew();\n','')

          # Footer version label.
          s=s.replace('  بيانات الطقس والراصد تتحدث تلقائيًا\n</footer>', '  طقس هدى وما جاورها • الإصدار 2.1\n</footer>')

          # Current atmosphere uses already-loaded current/hourly data.
          old='''  document.getElementById("currentIcon").textContent=\n    weatherIcon(c.weather_code);\n}'''
          new='''  document.getElementById("currentIcon").textContent=\n    weatherIcon(c.weather_code);\n\n  showCurrentAtmosphere(data);\n}\n\nfunction showCurrentAtmosphere(data){\n  const c=data.current || {};\n  const i=getCurrentHourIndex(data);\n  const cloud=Number(data.hourly.cloud_cover?.[i] ?? 0);\n  const visibility=Number(data.hourly.visibility?.[i] ?? 0);\n  const box=document.getElementById("currentAtmosphere");\n  if(!box) return;\n  const visibilityText=visibility>0 ? `${(visibility/1000).toFixed(1)} كم` : "غير متاحة";\n  box.innerHTML=`<strong>${weatherIcon(c.weather_code)} ${weatherText(c.weather_code)}</strong> • `+\n    `الحرارة ${Math.round(c.temperature_2m)}° والمحسوسة ${Math.round(c.apparent_temperature)}° • `+\n    `الرطوبة ${Math.round(c.relative_humidity_2m)}% • السحب ${Math.round(cloud)}% • الرؤية ${visibilityText}.`;\n}'''
          if old not in s: raise SystemExit('showCurrentWeather target not found')
          s=s.replace(old,new,1)

          # Replace best-rain logic: future hourly precipitation amount is primary; probability tie-breaker.
          start=s.index('function showBestRain(data){')
          end=s.index('\n\n/* =========================================================\n   توقعات 7 أيام', start)
          best='''function showBestRain(data){\n  const nowParts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Aden",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).formatToParts(new Date());\n  const p={}; nowParts.forEach(x=>p[x.type]=x.value);\n  const currentHour=`${p.year}-${p.month}-${p.day}T${p.hour}:00`;\n  let bestIndex=-1;\n  let bestAmount=0;\n  let bestChance=-1;\n\n  for(let i=0;i<data.hourly.time.length;i++){\n    if(data.hourly.time[i] < currentHour) continue;\n    const amount=Number(data.hourly.precipitation[i] ?? 0);\n    const chance=Number(data.hourly.precipitation_probability[i] ?? 0);\n    if(amount>bestAmount || (amount===bestAmount && amount>0 && chance>bestChance)){\n      bestAmount=amount;\n      bestChance=chance;\n      bestIndex=i;\n    }\n  }\n\n  if(bestIndex<0 || bestAmount<=0){\n    document.getElementById("bestRain").textContent="لا توجد كمية مطر متوقعة في الساعات القادمة حاليًا.";\n    document.getElementById("bestRainDetails").textContent="سيعاد التحليل تلقائيًا مع تحديث البيانات ومرور الوقت.";\n    return;\n  }\n\n  const date=new Date(data.hourly.time[bestIndex]);\n  const time=date.toLocaleString("ar-YE",{weekday:"long",hour:"numeric",minute:"2-digit",hour12:true});\n  document.getElementById("bestRain").textContent=`أفضل ساعة: ${time}`;\n  document.getElementById("bestRainDetails").textContent=`كمية المطر المتوقعة ${bestAmount.toFixed(1)} ملم • احتمال الهطول ${Math.round(bestChance)}%`;\n}'''
          s=s[:start]+best+s[end:]

          # Replace dust loader. PM10 is displayed as particles, direct dust + visibility inform visible-dust wording.
          start=s.index('async function loadDust(){')
          end=s.index('\n\n/* =========================================================\n   شبكة بحر العرب الموسعة', start)
          dust='''async function loadDust(){\n  try{\n    const url=\n      `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${latitude}&longitude=${longitude}`+\n      `&current=pm10,pm2_5,dust&timezone=Asia%2FAden`;\n    const response=await fetch(url);\n    if(!response.ok) throw new Error("Air quality API error");\n    const data=await response.json();\n    const c=data.current || {};\n    const pm10=Number(c.pm10);\n    const directDust=Number(c.dust);\n    document.getElementById("observerDust").textContent=\n      Number.isFinite(pm10) ? `${Math.round(pm10)} µg/m³` : "--";\n\n    const i=weatherData ? getCurrentHourIndex(weatherData) : -1;\n    const visibility=i>=0 ? Number(weatherData.hourly.visibility?.[i] ?? 0) : 0;\n    const visibilityKm=visibility>0 ? visibility/1000 : null;\n    let note="PM10 يقيس الجسيمات العالقة ولا يثبت وحده وجود غبار كثيف مرئي.";\n    if(Number.isFinite(directDust) && directDust>0 && visibilityKm!==null && visibilityKm<8){\n      note=`توجد إشارة غبار مباشر مع انخفاض الرؤية إلى ${visibilityKm.toFixed(1)} كم.`;\n    }else if(visibilityKm!==null && visibilityKm>=10){\n      note=`الرؤية جيدة (${visibilityKm.toFixed(1)} كم) • لا توجد دلالة على غبار كثيف مرئي حاليًا.`;\n    }else if(Number.isFinite(directDust) && directDust>0){\n      note="توجد جسيمات غبار مرصودة، لكن لا تكفي البيانات الحالية لوصف غبار كثيف مرئي.";\n    }\n    document.getElementById("observerDustNote").textContent=note;\n  }catch(error){\n    console.error(error);\n    document.getElementById("observerDust").textContent="تعذر التحديث";\n    document.getElementById("observerDustNote").textContent="تعذر تقييم الجسيمات والغبار حاليًا.";\n  }\n}'''
          s=s[:start]+dust+s[end:]

          # Current star: calculate by Aden calendar date and expose a testable helper.
          start=s.index('function showCurrentStar(){')
          end=s.index('\n\nfunction renderStars(){', start)
          current_star='''function findCurrentStar(date){\n  const today=new Date(date.getFullYear(),date.getMonth(),date.getDate());\n  for(const group of starsData){\n    for(const star of group.stars){\n      const start=parseStarEntryDate(star[1]);\n      if(!start) continue;\n      const end=new Date(start); end.setDate(end.getDate()+12);\n      if(today>=start && today<=end) return {name:star[0],season:group.season,date:star[1],start,end};\n    }\n  }\n  return null;\n}\n\nfunction showCurrentStar(){\n  const box=document.getElementById("currentStarGrid");\n  if(!box) return;\n  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Aden",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());\n  const p={}; parts.forEach(x=>p[x.type]=x.value);\n  const today=new Date(Number(p.year),Number(p.month)-1,Number(p.day));\n  const current=findCurrentStar(today);\n  if(!current){\n    box.innerHTML='<div class="current-star-item" style="grid-column:1/-1"><strong>التاريخ الحالي خارج نطاق جدول هدى 2026–2027.</strong></div>';\n    return;\n  }\n  const currentDay=Math.floor((today-current.start)/86400000)+1;\n  const remaining=Math.max(0,13-currentDay);\n  const endText=current.end.toLocaleDateString("ar-YE",{day:"numeric",month:"long",year:"numeric"});\n  box.innerHTML=`\n    <div class="current-star-item"><span>اسم النجم</span><strong>⭐ ${current.name}</strong></div>\n    <div class="current-star-item"><span>الفصل</span><strong>${current.season}</strong></div>\n    <div class="current-star-item"><span>الفترة</span><strong>${current.date} – ${endText}</strong></div>\n    <div class="current-star-item"><span>اليوم الحالي</span><strong>اليوم ${currentDay} من النجم</strong></div>\n    <div class="current-star-item"><span>الأيام المتبقية</span><strong>${remaining} يوم</strong></div>`;\n}'''
          s=s[:start]+current_star+s[end:]

          # Season labels with requested icons; star rows only name + entry date (year hidden in list only).
          old_render='''  root.innerHTML=starsData.map(group=>`\n    <section class="season">\n      <div class="season-title">${group.season}</div>\n      <div class="stars-grid">\n        ${group.stars.map(star=>`\n          <button class="star-item" onclick="openStarDetail('${star[0]}','${star[1]}')">\n            <span class="star-name">⭐ ${star[0]}</span>\n            <span class="star-date">${star[1]}</span>\n          </button>`).join("")}\n      </div>\n    </section>`).join("");'''
          new_render='''  const icons={"الربيع":"🌱","الصيف":"☀️","الخريف":"🍂","الشتاء":"❄️"};\n  root.innerHTML=starsData.map(group=>`\n    <section class="season">\n      <div class="season-title">${icons[group.season]||"⭐"} ${group.season}</div>\n      <div class="stars-grid">\n        ${group.stars.map(star=>`\n          <button class="star-item" onclick="openStarDetail('${star[0]}','${star[1]}')">\n            <span class="star-name">${star[0]}</span>\n            <span class="star-date">${star[1].replace(/\\s+\\d{4}$/,'')}</span>\n          </button>`).join("")}\n      </div>\n    </section>`).join("");'''
          if old_render not in s: raise SystemExit('renderStars target not found')
          s=s.replace(old_render,new_render,1)

          # Recalculate best rain as time advances, without refetching all data.
          s=s.replace('loadPrayers();\n\n</script>', 'loadPrayers();\nsetInterval(()=>{ if(weatherData) showBestRain(weatherData); },60000);\n\n</script>')

          # Validation requested before commit.
          assert s != original
          assert '✨ ما الجديد' not in s and 'whatsNewModal' not in s and 'openWhatsNew' not in s
          assert 'طقس هدى وما جاورها • الإصدار 2.1' in s
          assert '🌫️ الجسيمات PM10' in s and 'الغبار PM10' not in s
          assert '🌤️ الأجواء حاليًا' in s and 'currentAtmosphere' in s
          assert 'data.hourly.time[i] < currentHour' in s
          assert 'amount>bestAmount' in s
          assert 'bestAmount.toFixed(1)' in s and 'bestChance' in s
          assert 'لا توجد كمية مطر متوقعة في الساعات القادمة حاليًا.' in s
          assert s.count('["') >= 28
          for season in ['الربيع','الصيف','الخريف','الشتاء']:
            assert f'season:"{season}"' in s
          assert '["خامس","21 سبتمبر 2026"]' in s
          # Mathematical date test: 26 Sep is within 21 Sep + 12 days => through 3 Oct.
          from datetime import date,timedelta
          st=date(2026,9,21); en=st+timedelta(days=12); test=date(2026,9,26)
          assert st <= test <= en and en == date(2026,10,3)
          # Preserve protected major sections and prayer table.
          for token in ['const PRAYER_TABLE=','مركز متابعة بحر العرب','embed.windy.com','برعاية','sponsor-albaqira.jpg','مقارنة الموديلات','متابعة الزلازل']:
            assert token in s
          # Basic structural checks.
          assert s.count('<script>') == s.count('</script>')
          assert s.count('<style>') == s.count('</style>')
          assert s.count('stars:[\n') == 4
          p.write_text(s,encoding='utf-8')
      - name: Commit validated update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/update-2-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-2-1.yml
          git commit -m "feat: release Huda Weather 2.1"
          git push origin main
