name: Deploy Rasid Hada Worker

on:
  workflow_dispatch:
  push:
    branches:
      - rasid-hada-private
    paths:
      - 'rasid-hada/cloudflare/**'
      - '.github/workflows/rasid-hada-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rasid-hada/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rasid-hada-private
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a16d4f178bae474099aa23095030294
      - name: Verify production
        run: |
          curl --fail --silent --show-error https://rasid.hada-weather.com/health
          echo
          curl --fail --silent --show-error https://rasid.hada-weather.com/health/db
          echo
      - name: Verify owner login and role
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({email:process.env.OWNER_EMAIL,password:process.env.OWNER_PASSWORD}))')"
          LOGIN="$(curl --fail --silent --show-error -X POST https://rasid.hada-weather.com/auth/login -H "Content-Type: application/json" --data "$PAYLOAD")"
          TOKEN="$(LOGIN="$LOGIN" node -e 'const d=JSON.parse(process.env.LOGIN); if(!d.access_token) process.exit(1); process.stdout.write(d.access_token)')"
          ME="$(curl --fail --silent --show-error https://rasid.hada-weather.com/auth/me -H "Authorization: Bearer $TOKEN")"
          ME="$ME" node -e 'const d=JSON.parse(process.env.ME); if(d.role!=="owner") process.exit(1); console.log("Owner authentication verified.")'
          REFRESH="$(curl --fail --silent --show-error -X POST https://rasid.hada-weather.com/admin/weather/refresh -H "Authorization: Bearer $TOKEN")"
          REFRESH="$REFRESH" node -e 'const d=JSON.parse(process.env.REFRESH); if(d.status!=="ok"||!Array.isArray(d.models)||d.models.filter(x=>x.status==="ok").length<4) process.exit(1); console.log("Weather model refresh verified.")'
          ANALYZE="$(curl --fail --silent --show-error -X POST https://rasid.hada-weather.com/admin/weather/analyze -H "Authorization: Bearer $TOKEN")"
          ANALYZE="$ANALYZE" node -e 'const d=JSON.parse(process.env.ANALYZE); if(d.status!=="ok"||!d.analysis||!d.analysis.confidence) process.exit(1); console.log("Weather consensus analysis verified.")'
          DUST="$(curl --fail --silent --show-error https://rasid.hada-weather.com/weather/dust)"
          DUST="$DUST" node -e 'const d=JSON.parse(process.env.DUST); if(d.status!=="ok") process.exit(1); console.log("Dust monitoring verified.")'
          SEA="$(curl --fail --silent --show-error https://rasid.hada-weather.com/weather/arabian-sea)"
          SEA="$SEA" node -e 'const d=JSON.parse(process.env.SEA); if(d.status!=="ok"||d.points_checked<8) process.exit(1); console.log("Arabian Sea monitoring verified.")'
          curl --fail --silent --show-error -X POST https://rasid.hada-weather.com/auth/logout -H "Authorization: Bearer $TOKEN" >/dev/null
