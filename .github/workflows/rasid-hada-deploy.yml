name: Deploy Rasid Hada Worker

on:
  workflow_dispatch:
  push:
    branches:
      - rasid-hada-private
    paths:
      - 'rasid-hada/cloudflare/**'
      - '.github/workflows/rasid-hada-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rasid-hada/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rasid-hada-private
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a16d4f178bae474099aa23095030294
      - name: Verify production
        run: |
          curl --fail --silent --show-error https://rasid.hada-weather.com/health
          echo
          curl --fail --silent --show-error https://rasid.hada-weather.com/health/db
          echo
      - name: Bootstrap initial owner if needed
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a16d4f178bae474099aa23095030294
        run: |
          if [ -z "$OWNER_EMAIL" ] || [ -z "$OWNER_PASSWORD" ]; then
            echo "Owner secrets are missing"; exit 1
          fi
          STATUS="$(curl --fail --silent --show-error https://rasid.hada-weather.com/auth/setup-status)"
          if echo "$STATUS" | grep -q '"setup_required":true'; then
            BOOTSTRAP_SECRET="$(openssl rand -hex 32)"
            printf '%s' "$BOOTSTRAP_SECRET" | npx wrangler secret put OWNER_BOOTSTRAP_SECRET
            cleanup() { npx wrangler secret delete OWNER_BOOTSTRAP_SECRET --force >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            sleep 5
            PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({email:process.env.OWNER_EMAIL,password:process.env.OWNER_PASSWORD}))')"
            curl --fail --silent --show-error -X POST https://rasid.hada-weather.com/auth/bootstrap-owner \
              -H "Content-Type: application/json" \
              -H "X-Bootstrap-Secret: $BOOTSTRAP_SECRET" \
              --data "$PAYLOAD"
            echo
            cleanup
            trap - EXIT
          else
            echo "Owner already exists; bootstrap skipped."
          fi
