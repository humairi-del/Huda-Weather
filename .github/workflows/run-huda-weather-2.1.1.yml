name: Run Huda Weather 2.1.1
on:
  push:
    paths:
      - '.github/workflows/run-huda-weather-2.1.1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2.1.1
        run: python .github/apply_211.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<script')==s.count('</script>')
          assert s.count('<style')==s.count('</style>')
          for x in ['ℹ️ عن الموقع','🔔 تنبيهات الطقس','🌦️ توقعات الموديلات','🌍 الزلازل','const PRAYER_TABLE=','const starsData=','seaPoints=[','الإصدار 2.1.1']:
              assert x in s,x
          print('validation passed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: Huda Weather 2.1.1 usability update'
          git push
